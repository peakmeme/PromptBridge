appId: com.electron.peakmeme
productName: peakmeme
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - node_modules/**/*
extraResources:
  - from: assets/models
    to: assets/models
    filter:
      - '**/*'
asarUnpack:
  - node_modules/onnxruntime-node/**/*
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: resources/icon.png
  category: public.app-category.productivity
  hardenedRuntime: false
win:
  target:
    - nsis
  icon: resources/icon.png
linux:
  target:
    - AppImage
  icon: resources/icon.png
npmRebuild: false
nodeGypRebuild: false
